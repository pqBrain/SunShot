name: CI

# A small check on macOS 26, Sunshot's oldest supported macOS: static checks, debug and release builds, Core tests
# and AC traceability (`scripts/gate.sh --ci`). The full gate (rendering, snapshots, video, WebKit, coverage, app
# bundle, smoke, perf) runs locally in the pre-push hook: GitHub's macOS runners are 3-core VMs with no GPU or video
# encoder, where those tests hang. See docs/QUALITY_GATE.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate (CI subset)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          sw_vers
          xcodebuild -version
          swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Gate (CI subset)
        run: scripts/gate.sh --ci
      - name: Job summary
        if: always()
        run: cat .build/gate/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            .build/gate/*.md
            .build/gate/*.json
            .build/gate/*.log
          if-no-files-found: ignore
