# Temporary: find which tests hang on the CI runner. Remove with scripts/ci/diagnose-hang.sh.
name: Diagnose test hang
on:
  pull_request:
    paths: [".github/workflows/diagnose-hang.yml", "scripts/ci/diagnose-hang.sh"]
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 55
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sw_vers && swift --version && sysctl -n hw.ncpu hw.memsize
      - name: Suspect suites together, in parallel, 300 s limit
        run: scripts/ci/diagnose-hang.sh --together 'VideoExportTests|VideoContentTests|WebKitCaptureTests|AnimateModelTests' 300
      - name: Whole test suite in parallel (like the gate), 600 s limit
        if: always()
        run: scripts/ci/diagnose-hang.sh --together '.' 600
